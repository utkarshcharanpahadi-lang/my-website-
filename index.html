    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #030508;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;

            padding: 30px 16px;
            position: relative;

        /* Dynamic gaming ambient esports lighting */
        body::before {

        @keyframes pulseGlow {

            border-radius: 30px;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #f3f4f6;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15), inset 0 0 10px rgba(59, 130, 246, 0.05);
            backdrop-filter: blur(10px);
            animation: borderShift 4s linear infinite;
        }

        @keyframes borderShift {
            0% { border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 0 15px rgba(59, 130, 246, 0.15); }
            50% { border-color: rgba(139, 92, 246, 0.5); box-shadow: 0 0 20px rgba(139, 92, 246, 0.2); }
            100% { border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 0 15px rgba(59, 130, 246, 0.15); }
        }

        /* Links Section */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Advanced RGB Neon LED Touch Sense Boxes */
        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(13, 18, 30, 0.85), rgba(7, 10, 18, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 17px 22px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* Continuous subtle RGB edge lighting */
        .link-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899, #3b82f6);
            background-size: 300% 300%;
            z-index: -1;
            opacity: 0.25;
            transition: opacity 0.3s ease;
            animation: rgbFlow 6s linear infinite;
        }

        @keyframes rgbFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Intense LED Touch Sense Glow on Hover/Active */
        .link-card:hover, .link-card:active {
            transform: translateY(-4px) scale(1.01);
            background: linear-gradient(135deg, rgba(20, 27, 45, 0.95), rgba(10, 14, 25, 0.98));
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(59, 130, 246, 0.35), 0 0 45px rgba(139, 92, 246, 0.2);
        }

        .link-card:hover::before {
            opacity: 0.9;
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1;
        }

        .link-content i {
            font-size: 1.25rem;
            color: #3b82f6;
            width: 24px;
            text-align: center;
            transition: transform 0.3s ease, color 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.4));
        }

        .link-card:hover .link-content i {
            transform: scale(1.15) rotate(5deg);
            color: #f3f4f6;
        }

        .link-card .fa-arrow-right {
            font-size: 0.8rem;
            color: #6b7280;
            transition: transform 0.3s ease, color 0.3s ease;
            z-index: 1;
        }

        .link-card:hover .fa-arrow-right {

        /* Footer */

            color: #6b7280;
            letter-spacing: 0.5px;
        }

        /* Mobile Optimization */

            .link-card {

            }
            h1 {

            }
        }
    </style>
